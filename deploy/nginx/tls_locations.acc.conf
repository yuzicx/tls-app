location = /tls {
    return 301 /tls/;
}

location ^~ /tls/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Prefix /tls;
    proxy_redirect ~^https?://[^/]+/exist/apps/tls-app/?(.*)$ /tls/$1;
    proxy_redirect /exist/apps/tls-app/ /tls/;
    proxy_cookie_path /exist/apps/tls-app/ /tls/;
    proxy_pass http://127.0.0.1:8090/exist/apps/tls-app/;
}

location = /tls_multilingual {
    return 301 /tls_multilingual/;
}

location ^~ /tls_multilingual/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header X-Forwarded-Prefix /tls_multilingual;
    proxy_redirect ~^https?://[^/]+/exist/apps/tls-app-multilingual/?(.*)$ /tls_multilingual/$1;
    proxy_redirect /exist/apps/tls-app-multilingual/ /tls_multilingual/;
    proxy_cookie_path /exist/apps/tls-app-multilingual/ /tls_multilingual/;
    proxy_pass http://127.0.0.1:8090/exist/apps/tls-app-multilingual/;
}
